<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>双人拼图大决斗</title>
    <style>
        :root {
            --purple-main: #a855f7;
            --purple-bg: #1e112a;
            --purple-card: #3b0764;
            --purple-glow: rgba(168, 85, 247, 0.4);
            
            --gold-main: #eab308;
            --gold-bg: #291e05;
            --gold-card: #713f12;
            --gold-glow: rgba(234, 179, 8, 0.4);

            --cyan-check: #06b6d4;
            --bg-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 顶部简易计时栏 */
        header {
            height: 75px;
            background: #1e293b;
            border-bottom: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .mode-badge {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #38bdf8;
        }

        /* 下一题按钮样式 */
        .btn-next {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
            transition: all 0.2s ease;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.5);
        }

        .btn-next:active {
            transform: scale(0.95);
        }

        .timer-box {
            background: #0f172a;
            padding: 6px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }

        .timer-title { font-size: 0.7rem; color: #94a3b8; }
        .timer-value { font-size: 1.8rem; font-weight: bold; color: #f43f5e; font-family: monospace; }

        /* 对战战场分屏 */
        .battlefield {
            flex: 1;
            display: flex;
            position: relative;
        }

        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        .side-purple {
            background: radial-gradient(circle at center, #2e1065 0%, var(--purple-bg) 100%);
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }
        .side-purple .player-title { color: var(--purple-main); text-shadow: 0 0 10px var(--purple-glow); }

        .side-gold {
            background: radial-gradient(circle at center, #54420a 0%, var(--gold-bg) 100%);
        }
        .side-gold .player-title { color: var(--gold-main); text-shadow: 0 0 10px var(--gold-glow); }

        .player-title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        /* 拼图网格容器（384px） */
        .board-wrapper {
            position: relative;
            width: 384px;
            height: 384px;
            max-width: 90vw;
            max-height: 90vw;
        }

        .puzzle-board {
            width: 100%;
            height: 100%;
            display: grid;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            touch-action: none;
        }

        .side-purple .puzzle-board { border: 2px solid var(--purple-main); }
        .side-gold .puzzle-board { border: 2px solid var(--gold-main); }

        /* 拼图块 */
        .tile {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            cursor: grab;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
            transition: transform 0.15s ease;
            position: relative;
            touch-action: none;
        }

        .tile:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 5;
        }

        .side-purple .tile { border: 1px solid var(--purple-main); }
        .side-gold .tile { border: 1px solid var(--gold-main); }

        .tile.dragging { opacity: 0.3; }

        /* 青色正确对勾 */
        .check-mark {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background-color: var(--cyan-check);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 0 8px var(--cyan-check);
            z-index: 10;
            pointer-events: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* 遮罩层（冰冻与算术） */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(6px);
        }

        .freeze-overlay {
            background: rgba(14, 165, 233, 0.85);
            color: #fff;
            border: 2px solid #38bdf8;
        }

        .freeze-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .math-overlay {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #a855f7;
            padding: 16px;
            color: #fff;
        }
        .side-gold .math-overlay { border-color: #eab308; }

        .math-title { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }

        .math-q-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .math-question { font-size: 1.8rem; font-weight: bold; color: #38bdf8; letter-spacing: 1px; }

        .math-input-box {
            font-size: 1.8rem;
            font-weight: bold;
            color: #facc15;
            background: #0f172a;
            padding: 2px 14px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            min-width: 65px;
            text-align: center;
        }

        .math-status { font-size: 0.85rem; color: #cbd5e1; height: 20px; margin-bottom: 8px; }

        .numpad {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            width: 100%;
        }

        .num-btn {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .num-btn:active {
            transform: scale(0.92);
            background: #38bdf8;
            color: #000;
        }

        .btn-clear {
            background: #ef4444;
            color: #fff;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 30px;
            width: 440px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-card h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #a855f7, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--purple-main), var(--gold-main));
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-secondary {
            background: #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .winner-text { font-size: 2rem; font-weight: bold; margin-bottom: 12px; }
        .winner-purple { color: var(--purple-main); text-shadow: 0 0 15px var(--purple-glow); }
        .winner-gold { color: var(--gold-main); text-shadow: 0 0 15px var(--gold-glow); }
        .winner-draw { color: #38bdf8; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <header>
        <div class="mode-badge" id="display-mode-text">模式: --</div>
        <button class="btn-next" onclick="nextQuestion()">🔄 下一题</button>
        <div class="timer-box">
            <div class="timer-title">剩余时间</div>
            <div class="timer-value" id="display-timer">00</div>
        </div>
    </header>

    <!-- 主战场 -->
    <div class="battlefield">
        <!-- 紫方战区 -->
        <div class="player-side side-purple">
            <div class="player-title">💜 紫方玩家</div>
            <div class="board-wrapper">
                <div class="puzzle-board" id="board-purple"></div>
                <!-- 冰冻遮罩 -->
                <div class="overlay-layer freeze-overlay hidden" id="freeze-purple">
                    <div class="freeze-title">❄️ 冰冻 2 秒</div>
                    <div>连续两次移动错误！</div>
                    <div style="font-size: 1.5rem; font-weight: bold; margin-top: 5px;" id="freeze-timer-purple">2s</div>
                </div>
                <!-- 数学锁关遮罩 (1-12 乘除法) -->
                <div class="overlay-layer math-overlay hidden" id="math-purple">
                    <div class="math-title">🎯 1-12 乘除法运算解锁</div>
                    <div class="math-q-row">
                        <span class="math-question" id="math-q-purple">3 × 4 =</span>
                        <span class="math-input-box" id="math-input-purple">?</span>
                    </div>
                    <div class="math-status" id="math-status-purple">点击数字输入答案</div>
                    <div class="numpad">
                        <button class="num-btn" onclick="pressMathNum('purple', '1')">1</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '2')">2</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '3')">3</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '4')">4</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '5')">5</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '6')">6</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '7')">7</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '8')">8</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '9')">9</button>
                        <button class="num-btn" onclick="pressMathNum('purple', '0')">0</button>
                        <button class="num-btn btn-clear" onclick="clearMathNum('purple')">C</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 金方战区 -->
        <div class="player-side side-gold">
            <div class="player-title">👑 金方玩家</div>
            <div class="board-wrapper">
                <div class="puzzle-board" id="board-gold"></div>
                <!-- 冰冻遮罩 -->
                <div class="overlay-layer freeze-overlay hidden" id="freeze-gold">
                    <div class="freeze-title">❄️ 冰冻 2 秒</div>
                    <div>连续两次移动错误！</div>
                    <div style="font-size: 1.5rem; font-weight: bold; margin-top: 5px;" id="freeze-timer-gold">2s</div>
                </div>
                <!-- 数学锁关遮罩 (1-12 乘除法) -->
                <div class="overlay-layer math-overlay hidden" id="math-gold">
                    <div class="math-title">🎯 1-12 乘除法运算解锁</div>
                    <div class="math-q-row">
                        <span class="math-question" id="math-q-gold">5 × 2 =</span>
                        <span class="math-input-box" id="math-input-gold">?</span>
                    </div>
                    <div class="math-status" id="math-status-gold">点击数字输入答案</div>
                    <div class="numpad">
                        <button class="num-btn" onclick="pressMathNum('gold', '1')">1</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '2')">2</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '3')">3</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '4')">4</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '5')">5</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '6')">6</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '7')">7</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '8')">8</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '9')">9</button>
                        <button class="num-btn" onclick="pressMathNum('gold', '0')">0</button>
                        <button class="num-btn btn-clear" onclick="clearMathNum('gold')">C</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 开始设置弹窗 -->
    <div class="modal-overlay" id="setup-modal">
        <div class="modal-card">
            <h2>⚔️ 拼图对战 Setup</h2>
            <div class="form-group">
                <label>选择模式 (Mode):</label>
                <select id="select-mode">
                    <option value="hanzi" selected>汉字模式 (Chinese Character)</option>
                    <option value="image">图片模式 (Image)</option>
                </select>
            </div>
            <div class="form-group">
                <label>拼图规格 (Grid Size):</label>
                <select id="select-grid">
                    <option value="2">2 × 2 (简单)</option>
                    <option value="3" selected>3 × 3 (经典九宫格)</option>
                    <option value="4">4 × 4 (困难)</option>
                </select>
            </div>
            <div class="form-group">
                <label>时间限制 (Time Limit):</label>
                <select id="select-time">
                    <option value="30">30 秒</option>
                    <option value="60" selected>60 秒</option>
                    <option value="90">90 秒</option>
                    <option value="0">无时间限制</option>
                </select>
            </div>

            <div style="margin: 15px 0; border-top: 1px solid #334155; padding-top: 12px; text-align: left;">
                <label style="font-size: 0.8rem; color: #94a3b8;">本地上传临时图片 (无需修改代码):</label>
                <input type="file" id="local-img-input" accept="image/png, image/jpeg, image/jpg" style="display:none;" onchange="handleLocalUpload(event)">
                <button class="btn-secondary" onclick="document.getElementById('local-img-input').click()">📁 选择文件添加并使用</button>
            </div>

            <button class="btn-start" onclick="startGame()">开始游戏</button>
        </div>
    </div>

    <!-- 结算弹窗 -->
    <div class="modal-overlay hidden" id="result-modal">
        <div class="modal-card">
            <div class="winner-text" id="winner-title">获胜者</div>
            <p id="winner-desc" style="color: #94a3b8; margin-bottom: 20px;"></p>
            <button class="btn-start" onclick="showSetup()">再来一局</button>
        </div>
    </div>

    <script>
        // 背景音乐加载
        const bgm = new Audio('bgm.mp3');
        bgm.loop = true;

        // 预设默认文字降级题库
        const DEFAULT_HANZI = ["福", "龙", "胜", "智", "勇", "华", "瑞", "雅", "德", "春"];

        let gameMode = 'hanzi';
        let gridSize = 3;
        let timeLimit = 60;
        let timerInterval = null;
        let timeRemaining = 0;
        let imgDataUrl = "";
        let lastSelectedSource = "";

        let githubHanziImages = [
            './images/hanzi/1.png',
            './images/hanzi/2.png',
            './images/hanzi/3.png',
            './images/hanzi/4.png',
            './images/hanzi/5.png',
            './images/hanzi/6.png',
            './images/hanzi/7.png',
            './images/hanzi/8.png', 
            './images/hanzi/9.png',
            './images/hanzi/10.png',
            './images/hanzi/11.png'
        ];

        let githubPictureImages = [
            './images/picture/1.jpg',
            './images/picture/2.jpg',
            './images/picture/3.jpg',
            './images/picture/4.jpg',
            './images/picture/5.jpg',
            './images/picture/6.jpg',
            './images/picture/7.jpg',
            './images/picture/8.jpg',
            './images/picture/9.jpg',
            './images/picture/10.jpg',
            './images/picture/11.jpg',
            './images/picture/12.jpg',
            './images/picture/13.png',
            './images/picture/14.jpg',
            './images/picture/15.jpg',
            './images/picture/16.jpg',
            './images/picture/17.jpg',
            './images/picture/18.jpg'
        ];

        let players = {
            purple: { board: [], consecutiveErrors: 0, isFrozen: false, isMathLocked: false, currentMath: null, inputVal: "" },
            gold: { board: [], consecutiveErrors: 0, isFrozen: false, isMathLocked: false, currentMath: null, inputVal: "" }
        };

        function showSetup() {
            bgm.pause();
            document.getElementById("result-modal").classList.add("hidden");
            document.getElementById("setup-modal").classList.remove("hidden");
        }

        function handleLocalUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const url = event.target.result;
                const currentSelectedMode = document.getElementById("select-mode").value;
                if (currentSelectedMode === 'hanzi') {
                    githubHanziImages.push(url);
                } else {
                    githubPictureImages.push(url);
                }
                alert("临时图片添加成功！已放入当前模式库中。");
            };
            reader.readAsDataURL(file);
        }

        function startGame() {
            gameMode = document.getElementById("select-mode").value;
            gridSize = parseInt(document.getElementById("select-grid").value);
            timeLimit = parseInt(document.getElementById("select-time").value);

            bgm.currentTime = 0;
            bgm.play().catch(err => console.log("BGM 自动播放提示:", err));

            document.getElementById("setup-modal").classList.add("hidden");
            document.getElementById("display-mode-text").innerText = `模式: ${gameMode === 'hanzi' ? '汉字拼图' : '图片拼图'}`;

            nextQuestion();
        }

        function nextQuestion() {
            if (gameMode === 'hanzi') {
                if (githubHanziImages.length > 0) {
                    let selected = githubHanziImages[Math.floor(Math.random() * githubHanziImages.length)];
                    if (githubHanziImages.length > 1) {
                        while (selected === lastSelectedSource) {
                            selected = githubHanziImages[Math.floor(Math.random() * githubHanziImages.length)];
                        }
                    }
                    lastSelectedSource = selected;
                    loadCustomImageUrl(selected, () => initGameBoards());
                } else {
                    let selectedChar = DEFAULT_HANZI[Math.floor(Math.random() * DEFAULT_HANZI.length)];
                    if (DEFAULT_HANZI.length > 1) {
                        while (selectedChar === lastSelectedSource) {
                            selectedChar = DEFAULT_HANZI[Math.floor(Math.random() * DEFAULT_HANZI.length)];
                        }
                    }
                    lastSelectedSource = selectedChar;
                    renderTextCanvas(selectedChar, (url) => {
                        imgDataUrl = url;
                        initGameBoards();
                    });
                }
            } else {
                if (githubPictureImages.length > 0) {
                    let selected = githubPictureImages[Math.floor(Math.random() * githubPictureImages.length)];
                    if (githubPictureImages.length > 1) {
                        while (selected === lastSelectedSource) {
                            selected = githubPictureImages[Math.floor(Math.random() * githubPictureImages.length)];
                        }
                    }
                    lastSelectedSource = selected;
                    loadCustomImageUrl(selected, () => initGameBoards());
                } else {
                    renderFallbackPictureCanvas("图片模式", (url) => {
                        imgDataUrl = url;
                        initGameBoards();
                    });
                }
            }
        }

        function initGameBoards() {
            initPlayerBoard('purple');
            initPlayerBoard('gold');
            startTimer();
        }

        function loadCustomImageUrl(url, callback) {
            const img = new Image();
            if (!url.startsWith('data:')) {
                img.crossOrigin = "Anonymous";
            }
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 384;
                canvas.height = 384;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 384, 384);
                imgDataUrl = canvas.toDataURL();
                callback();
            };
            img.onerror = () => {
                renderFallbackPictureCanvas("加载失败", (fallbackUrl) => {
                    imgDataUrl = fallbackUrl;
                    callback();
                });
            };
            img.src = url;
        }

        function renderTextCanvas(char, callback) {
            const canvas = document.createElement('canvas');
            canvas.width = 384; canvas.height = 384;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#1e293b"; ctx.fillRect(0, 0, 384, 384);
            ctx.strokeStyle = "#334155"; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(192, 0); ctx.lineTo(192, 384);
            ctx.moveTo(0, 192); ctx.lineTo(384, 192);
            ctx.stroke();
            ctx.fillStyle = "#f8fafc";
            ctx.font = 'bold 260px "Kaiti", "STKaiti", serif';
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(char, 192, 204);
            callback(canvas.toDataURL());
        }

        function renderFallbackPictureCanvas(text, callback) {
            const canvas = document.createElement('canvas');
            canvas.width = 384; canvas.height = 384;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#0284c7"; ctx.fillRect(0, 0, 384, 384);
            ctx.fillStyle = "#ffffff";
            ctx.font = 'bold 42px sans-serif';
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, 192, 192);
            callback(canvas.toDataURL());
        }

        // 检查数组中是否有任何一块拼图恰好在原位
        function hasAnyCorrectTile(arr) {
            return arr.some((val, idx) => val === idx);
        }

        function initPlayerBoard(p) {
            const boardEl = document.getElementById(`board-${p}`);
            boardEl.innerHTML = "";
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            const totalTiles = gridSize * gridSize;
            let indices = Array.from({length: totalTiles}, (_, i) => i);

            // 核心修改：持续打乱，直到【没有任何一块】拼图处于正确位置（Derangement 错位排列）
            do {
                indices.sort(() => Math.random() - 0.5);
            } while (hasAnyCorrectTile(indices));

            players[p].board = [...indices];
            players[p].consecutiveErrors = 0;
            players[p].isFrozen = false;
            players[p].isMathLocked = false;
            players[p].inputVal = "";

            document.getElementById(`freeze-${p}`).classList.add("hidden");
            document.getElementById(`math-${p}`).classList.add("hidden");

            renderBoardTiles(p);
        }

        function renderBoardTiles(p) {
            const boardEl = document.getElementById(`board-${p}`);
            boardEl.innerHTML = "";

            players[p].board.forEach((tileIdx, currentPos) => {
                const tile = document.createElement("div");
                tile.className = "tile";
                tile.draggable = !players[p].isFrozen && !players[p].isMathLocked;
                tile.dataset.player = p;
                tile.dataset.originalIndex = tileIdx;
                tile.dataset.currentPos = currentPos;

                const row = Math.floor(tileIdx / gridSize);
                const col = tileIdx % gridSize;
                const percentage = 100 / (gridSize - 1);

                tile.style.backgroundImage = `url(${imgDataUrl})`;
                tile.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
                tile.style.backgroundPosition = `${col * percentage}% ${row * percentage}%`;

                if (tileIdx === currentPos) {
                    const check = document.createElement("div");
                    check.className = "check-mark";
                    check.innerText = "✓";
                    tile.appendChild(check);
                }

                // 鼠标拖拽事件
                tile.addEventListener("dragstart", handleDragStart);
                tile.addEventListener("dragover", handleDragOver);
                tile.addEventListener("drop", handleDrop);
                tile.addEventListener("dragend", handleDragEnd);

                // 触摸屏拖曳事件 (Touch Events)
                tile.addEventListener("touchstart", handleTouchStart, { passive: false });
                tile.addEventListener("touchmove", handleTouchMove, { passive: false });
                tile.addEventListener("touchend", handleTouchEnd, { passive: false });

                boardEl.appendChild(tile);
            });
        }

        // --- 鼠标拖拽逻辑 ---
        let draggedTile = null;

        function handleDragStart(e) {
            const p = this.dataset.player;
            if (players[p].isFrozen || players[p].isMathLocked) {
                e.preventDefault();
                return;
            }
            draggedTile = this;
            this.classList.add("dragging");
            e.dataTransfer.setData("text/plain", this.dataset.currentPos);
        }

        function handleDragOver(e) { e.preventDefault(); }

        function handleDrop(e) {
            e.preventDefault();
            if (!draggedTile) return;

            const targetTile = this;
            const p = draggedTile.dataset.player;

            if (p !== targetTile.dataset.player) return;
            if (players[p].isFrozen || players[p].isMathLocked) return;

            const posA = parseInt(draggedTile.dataset.currentPos);
            const posB = parseInt(targetTile.dataset.currentPos);

            swapTiles(p, posA, posB);
        }

        function handleDragEnd() {
            if (draggedTile) {
                draggedTile.classList.remove("dragging");
                draggedTile = null;
            }
        }

        // --- 触摸屏触碰式拖拽核心逻辑 ---
        let touchDraggedTile = null;
        let touchClone = null;

        function handleTouchStart(e) {
            const p = this.dataset.player;
            if (players[p].isFrozen || players[p].isMathLocked) return;

            touchDraggedTile = this;

            touchClone = this.cloneNode(true);
            touchClone.style.position = "fixed";
            touchClone.style.zIndex = "1000";
            touchClone.style.pointerEvents = "none";
            touchClone.style.opacity = "0.85";
            touchClone.style.transform = "scale(1.1)";
            touchClone.style.width = this.offsetWidth + "px";
            touchClone.style.height = this.offsetHeight + "px";

            const rect = this.getBoundingClientRect();
            touchClone.style.left = rect.left + "px";
            touchClone.style.top = rect.top + "px";

            document.body.appendChild(touchClone);
            this.classList.add("dragging");
        }

        function handleTouchMove(e) {
            if (!touchDraggedTile || !touchClone) return;
            e.preventDefault();

            const touch = e.touches[0];
            touchClone.style.left = (touch.clientX - touchClone.offsetWidth / 2) + "px";
            touchClone.style.top = (touch.clientY - touchClone.offsetHeight / 2) + "px";
        }

        function handleTouchEnd(e) {
            if (!touchDraggedTile) return;

            const touch = e.changedTouches[0];
            
            if (touchClone) {
                touchClone.remove();
                touchClone = null;
            }

            touchDraggedTile.classList.remove("dragging");

            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropTargetTile = targetEl ? targetEl.closest(".tile") : null;

            if (dropTargetTile && dropTargetTile !== touchDraggedTile) {
                const p = touchDraggedTile.dataset.player;
                const targetPlayer = dropTargetTile.dataset.player;

                if (p === targetPlayer && !players[p].isFrozen && !players[p].isMathLocked) {
                    const posA = parseInt(touchDraggedTile.dataset.currentPos);
                    const posB = parseInt(dropTargetTile.dataset.currentPos);

                    swapTiles(p, posA, posB);
                }
            }

            touchDraggedTile = null;
        }

        // 通用图块对调与惩罚/关卡逻辑
        function swapTiles(p, posA, posB) {
            if (posA === posB) return;

            const temp = players[p].board[posA];
            players[p].board[posA] = players[p].board[posB];
            players[p].board[posB] = temp;

            const tileAIsCorrect = (players[p].board[posA] === posA);
            const tileBIsCorrect = (players[p].board[posB] === posB);

            if (tileAIsCorrect || tileBIsCorrect) {
                players[p].consecutiveErrors = 0;
                renderBoardTiles(p);
                triggerMathChallenge(p);
            } else {
                players[p].consecutiveErrors++;
                renderBoardTiles(p);

                if (players[p].consecutiveErrors >= 2) {
                    triggerFreeze(p);
                }
            }
        }

        // 冰冻 2 秒处理
        function triggerFreeze(p) {
            players[p].isFrozen = true;
            players[p].consecutiveErrors = 0;

            const freezeOverlay = document.getElementById(`freeze-${p}`);
            const freezeTimerEl = document.getElementById(`freeze-timer-${p}`);
            freezeOverlay.classList.remove("hidden");

            let remainingSec = 2;
            freezeTimerEl.innerText = `${remainingSec}s`;

            renderBoardTiles(p);

            const interval = setInterval(() => {
                remainingSec--;
                if (remainingSec > 0) {
                    freezeTimerEl.innerText = `${remainingSec}s`;
                } else {
                    clearInterval(interval);
                    players[p].isFrozen = false;
                    freezeOverlay.classList.add("hidden");
                    renderBoardTiles(p);
                }
            }, 1000);
        }

        // 触发 1-12 乘除法锁关题
        function triggerMathChallenge(p) {
            players[p].isMathLocked = true;
            players[p].inputVal = "";
            players[p].currentMath = generateMultiplicationDivisionMath();

            const mathOverlay = document.getElementById(`math-${p}`);
            const mathQ = document.getElementById(`math-q-${p}`);
            const mathInput = document.getElementById(`math-input-${p}`);
            const mathStatus = document.getElementById(`math-status-${p}`);

            mathQ.innerText = `${players[p].currentMath.q} =`;
            mathInput.innerText = "?";
            mathStatus.innerText = "点击数字输入答案";
            mathStatus.style.color = "#cbd5e1";

            mathOverlay.classList.remove("hidden");
            renderBoardTiles(p);
        }

        function generateMultiplicationDivisionMath() {
            const isMultiplication = Math.random() < 0.5;
            const a = Math.floor(Math.random() * 12) + 1;
            const b = Math.floor(Math.random() * 12) + 1;

            if (isMultiplication) {
                return { q: `${a} × ${b}`, a: a * b };
            } else {
                const product = a * b;
                return { q: `${product} ÷ ${a}`, a: b };
            }
        }

        function pressMathNum(p, digit) {
            if (!players[p].isMathLocked) return;

            players[p].inputVal += digit;
            document.getElementById(`math-input-${p}`).innerText = players[p].inputVal;

            const targetStr = players[p].currentMath.a.toString();

            if (players[p].inputVal.length === targetStr.length) {
                if (players[p].inputVal === targetStr) {
                    players[p].isMathLocked = false;
                    document.getElementById(`math-${p}`).classList.add("hidden");
                    renderBoardTiles(p);

                    if (checkArrayWin(players[p].board)) {
                        endGame(p);
                    }
                } else {
                    const mathStatus = document.getElementById(`math-status-${p}`);
                    mathStatus.innerText = "❌ 答案错误！惩罚多做一题！";
                    mathStatus.style.color = "#f43f5e";

                    players[p].inputVal = "";
                    players[p].currentMath = generateMultiplicationDivisionMath();

                    setTimeout(() => {
                        document.getElementById(`math-q-${p}`).innerText = `${players[p].currentMath.q} =`;
                        document.getElementById(`math-input-${p}`).innerText = "?";
                    }, 400);
                }
            }
        }

        function clearMathNum(p) {
            if (!players[p].isMathLocked) return;
            players[p].inputVal = "";
            document.getElementById(`math-input-${p}`).innerText = "?";
        }

        function checkArrayWin(arr) {
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== i) return false;
            }
            return true;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeRemaining = timeLimit;

            const timerDisplay = document.getElementById("display-timer");
            if (timeLimit === 0) {
                timerDisplay.innerText = "∞";
                return;
            }

            timerDisplay.innerText = timeRemaining;

            timerInterval = setInterval(() => {
                timeRemaining--;
                timerDisplay.innerText = timeRemaining;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    evaluateTimeoutWinner();
                }
            }, 1000);
        }

        function evaluateTimeoutWinner() {
            let purpleCorrect = 0, goldCorrect = 0;
            players.purple.board.forEach((val, idx) => { if (val === idx) purpleCorrect++; });
            players.gold.board.forEach((val, idx) => { if (val === idx) goldCorrect++; });

            if (purpleCorrect > goldCorrect) {
                endGame('purple', `时间到！紫方正确 ${purpleCorrect} 块，优于金方 ${goldCorrect} 块`);
            } else if (goldCorrect > purpleCorrect) {
                endGame('gold', `时间到！金方正确 ${goldCorrect} 块，优于紫方 ${purpleCorrect} 块`);
            } else {
                endGame('draw', `时间到！双方均正确完成 ${purpleCorrect} 块！`);
            }
        }

        function endGame(winner, customMessage = "") {
            clearInterval(timerInterval);
            bgm.pause();

            const resultModal = document.getElementById("result-modal");
            const winnerTitle = document.getElementById("winner-title");
            const winnerDesc = document.getElementById("winner-desc");

            if (winner === 'purple') {
                winnerTitle.innerText = "💜 紫方玩家 获胜！";
                winnerTitle.className = "winner-text winner-purple";
                winnerDesc.innerText = customMessage || "率先还原全部拼图并破解算术关卡！";
            } else if (winner === 'gold') {
                winnerTitle.innerText = "👑 金方玩家 获胜！";
                winnerTitle.className = "winner-text winner-gold";
                winnerDesc.innerText = customMessage || "率先还原全部拼图并破解算术关卡！";
            } else {
                winnerTitle.innerText = "🤝 势均力敌 - 平局！";
                winnerTitle.className = "winner-text winner-draw";
                winnerDesc.innerText = customMessage;
            }

            resultModal.classList.remove("hidden");
        }
    </script>
</body>
