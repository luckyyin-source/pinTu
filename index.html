<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人拼图大决斗</title>
    <style>
        :root {
            --purple-main: #a855f7;
            --purple-bg: #1e112a;
            --purple-card: #3b0764;
            --purple-glow: rgba(168, 85, 247, 0.4);
            
            --gold-main: #eab308;
            --gold-bg: #291e05;
            --gold-card: #713f12;
            --gold-glow: rgba(234, 179, 8, 0.4);

            --cyan-check: #06b6d4;
            --bg-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部简易计时栏 */
        header {
            height: 80px;
            background: #1e293b;
            border-bottom: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .mode-badge {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #38bdf8;
        }

        .timer-box {
            background: #0f172a;
            padding: 6px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }

        .timer-title { font-size: 0.7rem; color: #94a3b8; }
        .timer-value { font-size: 1.8rem; font-weight: bold; color: #f43f5e; font-family: monospace; }

        /* 对战战场分屏 */
        .battlefield {
            flex: 1;
            display: flex;
            position: relative;
        }

        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        .side-purple {
            background: radial-gradient(circle at center, #2e1065 0%, var(--purple-bg) 100%);
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }
        .side-purple .player-title { color: var(--purple-main); text-shadow: 0 0 10px var(--purple-glow); }

        .side-gold {
            background: radial-gradient(circle at center, #54420a 0%, var(--gold-bg) 100%);
        }
        .side-gold .player-title { color: var(--gold-main); text-shadow: 0 0 10px var(--gold-glow); }

        .player-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .board-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
        }

        .puzzle-board {
            width: 100%;
            height: 100%;
            display: grid;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .side-purple .puzzle-board { border: 2px solid var(--purple-main); }
        .side-gold .puzzle-board { border: 2px solid var(--gold-main); }

        /* 拼图块 */
        .tile {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            cursor: grab;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
            transition: transform 0.15s ease;
            position: relative;
            touch-action: none;
        }

        .tile:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 5;
        }

        .side-purple .tile { border: 1px solid var(--purple-main); }
        .side-gold .tile { border: 1px solid var(--gold-main); }

        .tile.dragging { opacity: 0.3; }

        /* 青色正确对勾 */
        .check-mark {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            background-color: var(--cyan-check);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 0 8px var(--cyan-check);
            z-index: 10;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* 遮罩层（冰冻与算术） */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(6px);
        }

        .freeze-overlay {
            background: rgba(14, 165, 233, 0.85);
            color: #fff;
            border: 2px solid #38bdf8;
        }

        .freeze-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .math-overlay {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #a855f7;
            padding: 15px;
            color: #fff;
        }
        .side-gold .math-overlay { border-color: #eab308; }

        .math-title { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 4px; }
        .math-question { font-size: 1.8rem; font-weight: bold; color: #38bdf8; margin-bottom: 8px; letter-spacing: 2px; }
        .math-status { font-size: 0.8rem; color: #f43f5e; height: 18px; margin-bottom: 8px; }

        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }

        .num-btn {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 0;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .num-btn:active {
            transform: scale(0.92);
            background: #38bdf8;
            color: #000;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 30px;
            width: 440px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-card h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #a855f7, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--purple-main), var(--gold-main));
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-secondary {
            background: #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .winner-text { font-size: 2rem; font-weight: bold; margin-bottom: 12px; }
        .winner-purple { color: var(--purple-main); text-shadow: 0 0 15px var(--purple-glow); }
        .winner-gold { color: var(--gold-main); text-shadow: 0 0 15px var(--gold-glow); }
        .winner-draw { color: #38bdf8; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 顶部极简栏 -->
    <header>
        <div class="mode-badge" id="display-mode-text">模式: --</div>
        <div class="timer-box">
            <div class="timer-title">剩余时间</div>
            <div class="timer-value" id="display-timer">00</div>
        </div>
    </header>

    <!-- 主战场 -->
    <div class="battlefield">
        <!-- 紫方战区 -->
        <div class="player-side side-purple">
            <div class="player-title">💜 紫方玩家</div>
            <div class="board-wrapper">
                <div class="puzzle-board" id="board-purple"></div>
                <!-- 冰冻遮罩 -->
                <div class="overlay-layer freeze-overlay hidden" id="freeze-purple">
                    <div class="freeze-title">❄️ 冰冻 2 秒</div>
                    <div>连续两次移动错误！</div>
                    <div style="font-size: 1.5rem; font-weight: bold; margin-top: 5px;" id="freeze-timer-purple">2s</div>
                </div>
                <!-- 数学锁关遮罩 -->
                <div class="overlay-layer math-overlay hidden" id="math-purple">
                    <div class="math-title">🎯 答对解锁下一步 (个位数算术)</div>
                    <div class="math-question" id="math-q-purple">3 + 4 = ?</div>
                    <div class="math-status" id="math-status-purple">点击数字选择答案</div>
                    <div class="numpad">
                        <button class="num-btn" onclick="submitMath('purple', 0)">0</button>
                        <button class="num-btn" onclick="submitMath('purple', 1)">1</button>
                        <button class="num-btn" onclick="submitMath('purple', 2)">2</button>
                        <button class="num-btn" onclick="submitMath('purple', 3)">3</button>
                        <button class="num-btn" onclick="submitMath('purple', 4)">4</button>
                        <button class="num-btn" onclick="submitMath('purple', 5)">5</button>
                        <button class="num-btn" onclick="submitMath('purple', 6)">6</button>
                        <button class="num-btn" onclick="submitMath('purple', 7)">7</button>
                        <button class="num-btn" onclick="submitMath('purple', 8)">8</button>
                        <button class="num-btn" onclick="submitMath('purple', 9)">9</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 金方战区 -->
        <div class="player-side side-gold">
            <div class="player-title">👑 金方玩家</div>
            <div class="board-wrapper">
                <div class="puzzle-board" id="board-gold"></div>
                <!-- 冰冻遮罩 -->
                <div class="overlay-layer freeze-overlay hidden" id="freeze-gold">
                    <div class="freeze-title">❄️ 冰冻 2 秒</div>
                    <div>连续两次移动错误！</div>
                    <div style="font-size: 1.5rem; font-weight: bold; margin-top: 5px;" id="freeze-timer-gold">2s</div>
                </div>
                <!-- 数学锁关遮罩 -->
                <div class="overlay-layer math-overlay hidden" id="math-gold">
                    <div class="math-title">🎯 答对解锁下一步 (个位数算术)</div>
                    <div class="math-question" id="math-q-gold">5 - 2 = ?</div>
                    <div class="math-status" id="math-status-gold">点击数字选择答案</div>
                    <div class="numpad">
                        <button class="num-btn" onclick="submitMath('gold', 0)">0</button>
                        <button class="num-btn" onclick="submitMath('gold', 1)">1</button>
                        <button class="num-btn" onclick="submitMath('gold', 2)">2</button>
                        <button class="num-btn" onclick="submitMath('gold', 3)">3</button>
                        <button class="num-btn" onclick="submitMath('gold', 4)">4</button>
                        <button class="num-btn" onclick="submitMath('gold', 5)">5</button>
                        <button class="num-btn" onclick="submitMath('gold', 6)">6</button>
                        <button class="num-btn" onclick="submitMath('gold', 7)">7</button>
                        <button class="num-btn" onclick="submitMath('gold', 8)">8</button>
                        <button class="num-btn" onclick="submitMath('gold', 9)">9</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 开始设置弹窗 -->
    <div class="modal-overlay" id="setup-modal">
        <div class="modal-card">
            <h2>⚔️ 拼图对战 Setup</h2>
            <div class="form-group">
                <label>选择模式 (Mode):</label>
                <select id="select-mode">
                    <option value="hanzi" selected>汉字模式 (Chinese Character)</option>
                    <option value="image">图片模式 (Image)</option>
                </select>
            </div>
            <div class="form-group">
                <label>拼图规格 (Grid Size):</label>
                <select id="select-grid">
                    <option value="2">2 × 2 (简单)</option>
                    <option value="3" selected>3 × 3 (经典九宫格)</option>
                    <option value="4">4 × 4 (困难)</option>
                </select>
            </div>
            <div class="form-group">
                <label>时间限制 (Time Limit):</label>
                <select id="select-time">
                    <option value="30">30 秒</option>
                    <option value="60" selected>60 秒</option>
                    <option value="90">90 秒</option>
                    <option value="0">无时间限制</option>
                </select>
            </div>

            <!-- 本地临时上传补充 -->
            <div style="margin: 15px 0; border-top: 1px solid #334155; padding-top: 12px; text-align: left;">
                <label style="font-size: 0.8rem; color: #94a3b8;">本地上传临时图片 (无需代码修改):</label>
                <input type="file" id="local-img-input" accept="image/png, image/jpeg, image/jpg" style="display:none;" onchange="handleLocalUpload(event)">
                <button class="btn-secondary" onclick="document.getElementById('local-img-input').click()">📁 选择文件添加并使用</button>
            </div>

            <button class="btn-start" onclick="startGame()">开始游戏</button>
        </div>
    </div>

    <!-- 结算弹窗 -->
    <div class="modal-overlay hidden" id="result-modal">
        <div class="modal-card">
            <div class="winner-text" id="winner-title">获胜者</div>
            <p id="winner-desc" style="color: #94a3b8; margin-bottom: 20px;"></p>
            <button class="btn-start" onclick="showSetup()">再来一局</button>
        </div>
    </div>

    <script>
        // 预设默认文字/图片降级题库
        const DEFAULT_HANZI = ["福", "龙", "胜", "智", "勇", "华", "瑞", "雅", "德", "春"];

        let gameMode = 'hanzi';
        let gridSize = 3;
        let timeLimit = 60;
        let timerInterval = null;
        let timeRemaining = 0;
        let imgDataUrl = "";

        // GitHub 仓库资源库缓存
        let githubHanziImages = [];
        let githubPictureImages = [];

        // 玩家独立状态
        let players = {
            purple: { board: [], consecutiveErrors: 0, isFrozen: false, isMathLocked: false, currentMath: null },
            gold: { board: [], consecutiveErrors: 0, isFrozen: false, isMathLocked: false, currentMath: null }
        };

        // 页面加载完成后，自动扫描 GitHub 仓库中的 images/ 文件夹
        window.addEventListener('DOMContentLoaded', () => {
            fetchGitHubRepositoryImages();
        });

        // 通过 GitHub API 扫描仓库图片并按文件夹分类
        async function fetchGitHubRepositoryImages() {
            const repoOwner = "luckyyin-source";
            const repoName = "pinTu";

            // 1. 扫描 images/hanzi/ 文件夹
            try {
                const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/images/hanzi`);
                if (res.ok) {
                    const files = await res.json();
                    githubHanziImages = files
                        .filter(f => f.type === 'file' && /\.(png|jpe?g)$/i.test(f.name))
                        .map(f => encodeURI(f.download_url));
                }
            } catch (e) { console.log("扫描 images/hanzi 失败，使用默认文字处理"); }

            // 2. 扫描 images/picture/ 文件夹
            try {
                const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/images/picture`);
                if (res.ok) {
                    const files = await res.json();
                    githubPictureImages = files
                        .filter(f => f.type === 'file' && /\.(png|jpe?g)$/i.test(f.name))
                        .map(f => encodeURI(f.download_url));
                }
            } catch (e) { console.log("扫描 images/picture 失败"); }

            // 3. 扫描根目录与 images/ 直属目录（兼容旧存放模式，如 糖.png）
            try {
                const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/images`);
                if (res.ok) {
                    const files = await res.json();
                    files.forEach(f => {
                        if (f.type === 'file' && /\.(png|jpe?g)$/i.test(f.name)) {
                            // 若没在子文件夹，默认归类入图片库与汉字库
                            const url = encodeURI(f.download_url);
                            if (!githubHanziImages.includes(url)) githubHanziImages.push(url);
                            if (!githubPictureImages.includes(url)) githubPictureImages.push(url);
                        }
                    });
                }
            } catch (e) {}
        }

        // 显示设置菜单
        function showSetup() {
            document.getElementById("result-modal").classList.add("hidden");
            document.getElementById("setup-modal").classList.remove("hidden");
        }

        // 本地文件上传支持
        function handleLocalUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const url = event.target.result;
                const currentSelectedMode = document.getElementById("select-mode").value;
                if (currentSelectedMode === 'hanzi') {
                    githubHanziImages.push(url);
                } else {
                    githubPictureImages.push(url);
                }
                alert("临时图片添加成功！已放入当前模式库中。");
            };
            reader.readAsDataURL(file);
        }

        // 开始游戏
        function startGame() {
            gameMode = document.getElementById("select-mode").value;
            gridSize = parseInt(document.getElementById("select-grid").value);
            timeLimit = parseInt(document.getElementById("select-time").value);

            document.getElementById("setup-modal").classList.add("hidden");
            document.getElementById("display-mode-text").innerText = `模式: ${gameMode === 'hanzi' ? '汉字拼图' : '图片拼图'}`;

            if (gameMode === 'hanzi') {
                // 如果 GitHub images/hanzi/ 有图片，优先随机加载
                if (githubHanziImages.length > 0) {
                    const randomImgUrl = githubHanziImages[Math.floor(Math.random() * githubHanziImages.length)];
                    loadCustomImageUrl(randomImgUrl, () => initGameBoards());
                } else {
                    // 否则自动根据汉字渲染图片
                    const randomChar = DEFAULT_HANZI[Math.floor(Math.random() * DEFAULT_HANZI.length)];
                    renderTextCanvas(randomChar, (url) => {
                        imgDataUrl = url;
                        initGameBoards();
                    });
                }
            } else {
                // 图片模式
                if (githubPictureImages.length > 0) {
                    const randomImgUrl = githubPictureImages[Math.floor(Math.random() * githubPictureImages.length)];
                    loadCustomImageUrl(randomImgUrl, () => initGameBoards());
                } else {
                    // 若无图片，自动生成彩色图形提示
                    renderFallbackPictureCanvas("图片模式", (url) => {
                        imgDataUrl = url;
                        initGameBoards();
                    });
                }
            }
        }

        // 初始化棋盘
        function initGameBoards() {
            initPlayerBoard('purple');
            initPlayerBoard('gold');
            startTimer();
        }

        // 将外部图片链接转为 HTML Canvas 图片
        function loadCustomImageUrl(url, callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 320;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 320, 320);
                imgDataUrl = canvas.toDataURL();
                callback();
            };
            img.onerror = () => {
                renderFallbackPictureCanvas("加载失败", (fallbackUrl) => {
                    imgDataUrl = fallbackUrl;
                    callback();
                });
            };
            img.src = url;
        }

        // 渲染文本图片 Canvas
        function renderTextCanvas(char, callback) {
            const canvas = document.createElement('canvas');
            canvas.width = 320; canvas.height = 320;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#1e293b"; ctx.fillRect(0, 0, 320, 320);
            ctx.strokeStyle = "#334155"; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(160, 0); ctx.lineTo(160, 320);
            ctx.moveTo(0, 160); ctx.lineTo(320, 160);
            ctx.stroke();
            ctx.fillStyle = "#f8fafc";
            ctx.font = 'bold 220px "Kaiti", "STKaiti", serif';
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(char, 160, 170);
            callback(canvas.toDataURL());
        }

        function renderFallbackPictureCanvas(text, callback) {
            const canvas = document.createElement('canvas');
            canvas.width = 320; canvas.height = 320;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#0284c7"; ctx.fillRect(0, 0, 320, 320);
            ctx.fillStyle = "#ffffff";
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, 160, 160);
            callback(canvas.toDataURL());
        }

        // 初始化单人棋盘
        function initPlayerBoard(p) {
            const boardEl = document.getElementById(`board-${p}`);
            boardEl.innerHTML = "";
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            const totalTiles = gridSize * gridSize;
            let indices = Array.from({length: totalTiles}, (_, i) => i);

            do {
                indices.sort(() => Math.random() - 0.5);
            } while (checkArrayWin(indices));

            players[p].board = [...indices];
            players[p].consecutiveErrors = 0;
            players[p].isFrozen = false;
            players[p].isMathLocked = false;

            document.getElementById(`freeze-${p}`).classList.add("hidden");
            document.getElementById(`math-${p}`).classList.add("hidden");

            renderBoardTiles(p);
        }

        // 渲染 Tile 节点
        function renderBoardTiles(p) {
            const boardEl = document.getElementById(`board-${p}`);
            boardEl.innerHTML = "";

            players[p].board.forEach((tileIdx, currentPos) => {
                const tile = document.createElement("div");
                tile.className = "tile";
                tile.draggable = !players[p].isFrozen && !players[p].isMathLocked;
                tile.dataset.player = p;
                tile.dataset.originalIndex = tileIdx;
                tile.dataset.currentPos = currentPos;

                const row = Math.floor(tileIdx / gridSize);
                const col = tileIdx % gridSize;
                const percentage = 100 / (gridSize - 1);

                tile.style.backgroundImage = `url(${imgDataUrl})`;
                tile.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
                tile.style.backgroundPosition = `${col * percentage}% ${row * percentage}%`;

                // ✅ 规则：正确位置加青色勾勾
                if (tileIdx === currentPos) {
                    const check = document.createElement("div");
                    check.className = "check-mark";
                    check.innerText = "✓";
                    tile.appendChild(check);
                }

                tile.addEventListener("dragstart", handleDragStart);
                tile.addEventListener("dragover", handleDragOver);
                tile.addEventListener("drop", handleDrop);
                tile.addEventListener("dragend", handleDragEnd);

                boardEl.appendChild(tile);
            });
        }

        let draggedTile = null;

        function handleDragStart(e) {
            const p = this.dataset.player;
            if (players[p].isFrozen || players[p].isMathLocked) {
                e.preventDefault();
                return;
            }
            draggedTile = this;
            this.classList.add("dragging");
            e.dataTransfer.setData("text/plain", this.dataset.currentPos);
        }

        function handleDragOver(e) { e.preventDefault(); }

        function handleDrop(e) {
            e.preventDefault();
            if (!draggedTile) return;

            const targetTile = this;
            const p = draggedTile.dataset.player;

            if (p !== targetTile.dataset.player) return;
            if (players[p].isFrozen || players[p].isMathLocked) return;

            const posA = parseInt(draggedTile.dataset.currentPos);
            const posB = parseInt(targetTile.dataset.currentPos);

            if (posA === posB) return;

            const temp = players[p].board[posA];
            players[p].board[posA] = players[p].board[posB];
            players[p].board[posB] = temp;

            const tileAIsCorrect = (players[p].board[posA] === posA);
            const tileBIsCorrect = (players[p].board[posB] === posB);

            if (tileAIsCorrect || tileBIsCorrect) {
                players[p].consecutiveErrors = 0;
                renderBoardTiles(p);
                triggerMathChallenge(p);
            } else {
                players[p].consecutiveErrors++;
                renderBoardTiles(p);

                // ✅ 规则：连续两次拖曳错误冻结 2 秒
                if (players[p].consecutiveErrors >= 2) {
                    triggerFreeze(p);
                }
            }
        }

        function handleDragEnd() {
            if (draggedTile) {
                draggedTile.classList.remove("dragging");
                draggedTile = null;
            }
        }

        // 冻结 2 秒处理
        function triggerFreeze(p) {
            players[p].isFrozen = true;
            players[p].consecutiveErrors = 0;

            const freezeOverlay = document.getElementById(`freeze-${p}`);
            const freezeTimerEl = document.getElementById(`freeze-timer-${p}`);
            freezeOverlay.classList.remove("hidden");

            let remainingSec = 2;
            freezeTimerEl.innerText = `${remainingSec}s`;

            renderBoardTiles(p);

            const interval = setInterval(() => {
                remainingSec--;
                if (remainingSec > 0) {
                    freezeTimerEl.innerText = `${remainingSec}s`;
                } else {
                    clearInterval(interval);
                    players[p].isFrozen = false;
                    freezeOverlay.classList.add("hidden");
                    renderBoardTiles(p);
                }
            }, 1000);
        }

        // 触发数学算术锁关题
        function triggerMathChallenge(p) {
            players[p].isMathLocked = true;
            players[p].currentMath = generateSingleDigitMath();

            const mathOverlay = document.getElementById(`math-${p}`);
            const mathQ = document.getElementById(`math-q-${p}`);
            const mathStatus = document.getElementById(`math-status-${p}`);

            mathQ.innerText = players[p].currentMath.q;
            mathStatus.innerText = "点击数字选择答案";
            mathStatus.style.color = "#cbd5e1";

            mathOverlay.classList.remove("hidden");
            renderBoardTiles(p);
        }

        // 生成个位数加减乘除题（答案限定 0-9）
        function generateSingleDigitMath() {
            const ops = ['+', '-', '*', '/'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let num1, num2, answer;

            if (op === '+') {
                answer = Math.floor(Math.random() * 10);
                num1 = Math.floor(Math.random() * (answer + 1));
                num2 = answer - num1;
            } else if (op === '-') {
                num1 = Math.floor(Math.random() * 10);
                num2 = Math.floor(Math.random() * (num1 + 1));
                answer = num1 - num2;
            } else if (op === '*') {
                const pairs = [];
                for (let a = 0; a <= 9; a++) {
                    for (let b = 0; b <= 9; b++) {
                        if (a * b <= 9) pairs.push([a, b]);
                    }
                }
                const pair = pairs[Math.floor(Math.random() * pairs.length)];
                num1 = pair[0]; num2 = pair[1]; answer = num1 * num2;
            } else if (op === '/') {
                answer = Math.floor(Math.random() * 10);
                num2 = Math.floor(Math.random() * 9) + 1;
                num1 = answer * num2;
            }

            const symbols = { '+': '+', '-': '-', '*': '×', '/': '÷' };
            return { q: `${num1} ${symbols[op]} ${num2} = ?`, a: answer };
        }

        // 验证数学题答案
        function submitMath(p, selectedNum) {
            if (!players[p].isMathLocked) return;

            const mathStatus = document.getElementById(`math-status-${p}`);

            if (selectedNum === players[p].currentMath.a) {
                players[p].isMathLocked = false;
                document.getElementById(`math-${p}`).classList.add("hidden");
                renderBoardTiles(p);

                if (checkArrayWin(players[p].board)) {
                    endGame(p);
                }
            } else {
                mathStatus.innerText = "❌ 答案错误！惩罚多做一题！";
                mathStatus.style.color = "#f43f5e";
                players[p].currentMath = generateSingleDigitMath();
                setTimeout(() => {
                    document.getElementById(`math-q-${p}`).innerText = players[p].currentMath.q;
                }, 300);
            }
        }

        function checkArrayWin(arr) {
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== i) return false;
            }
            return true;
        }

        // 计时器控制
        function startTimer() {
            clearInterval(timerInterval);
            timeRemaining = timeLimit;

            const timerDisplay = document.getElementById("display-timer");
            if (timeLimit === 0) {
                timerDisplay.innerText = "∞";
                return;
            }

            timerDisplay.innerText = timeRemaining;

            timerInterval = setInterval(() => {
                timeRemaining--;
                timerDisplay.innerText = timeRemaining;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    evaluateTimeoutWinner();
                }
            }, 1000);
        }

        function evaluateTimeoutWinner() {
            let purpleCorrect = 0, goldCorrect = 0;
            players.purple.board.forEach((val, idx) => { if (val === idx) purpleCorrect++; });
            players.gold.board.forEach((val, idx) => { if (val === idx) goldCorrect++; });

            if (purpleCorrect > goldCorrect) {
                endGame('purple', `时间到！紫方正确 ${purpleCorrect} 块，优于金方 ${goldCorrect} 块`);
            } else if (goldCorrect > purpleCorrect) {
                endGame('gold', `时间到！金方正确 ${goldCorrect} 块，优于紫方 ${purpleCorrect} 块`);
            } else {
                endGame('draw', `时间到！双方均正确完成 ${purpleCorrect} 块！`);
            }
        }

        function endGame(winner, customMessage = "") {
            clearInterval(timerInterval);

            const resultModal = document.getElementById("result-modal");
            const winnerTitle = document.getElementById("winner-title");
            const winnerDesc = document.getElementById("winner-desc");

            if (winner === 'purple') {
                winnerTitle.innerText = "💜 紫方玩家 获胜！";
                winnerTitle.className = "winner-text winner-purple";
                winnerDesc.innerText = customMessage || "率先还原全部拼图并破解算术关卡！";
            } else if (winner === 'gold') {
                winnerTitle.innerText = "👑 金方玩家 获胜！";
                winnerTitle.className = "winner-text winner-gold";
                winnerDesc.innerText = customMessage || "率先还原全部拼图并破解算术关卡！";
            } else {
                winnerTitle.innerText = "🤝 势均力敌 - 平局！";
                winnerTitle.className = "winner-text winner-draw";
                winnerDesc.innerText = customMessage;
            }

            resultModal.classList.remove("hidden");
        }
    </script>
</body>
</html>
